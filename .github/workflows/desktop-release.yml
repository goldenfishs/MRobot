name: desktop-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v; defaults to pyproject.toml
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
          - name: Windows x64
            runner: windows-2025
          - name: Linux x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      MROBOT_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install common build dependencies
        run: >-
          python -m pip install ./mcode PyQt5 PyYAML Jinja2 openpyxl packaging
          pyqtgraph pyserial requests pytest pyinstaller
      - name: Install Fluent Widgets on Windows and Linux
        if: runner.os != 'macOS'
        run: python -m pip install PyQt-Fluent-Widgets
      - name: Install Inno Setup on Windows
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes
      - name: Install minimal Fluent Widgets macOS bridge
        if: runner.os == 'macOS'
        run: >-
          python -m pip install darkdetect PyCocoa pyobjc-framework-Cocoa
          pyobjc-framework-Quartz && python -m pip install --no-deps
          PyQt5-Frameless-Window PyQt-Fluent-Widgets
      - name: Test
        run: python -m pytest -q
      - name: Build native package
        run: python tools/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: release-dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create update manifest
        run: >-
          python tools/create_update_manifest.py release-assets
          --repository "${{ github.repository }}" --tag "${{ github.ref_name }}"
      - name: Create release and upload native packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes
          gh release upload "${{ github.ref_name }}" release-assets/* \
            --repo "${{ github.repository }}" --clobber
      - name: Create MRobot origin manifest
        env:
          UPDATE_ORIGIN: https://updates.mrobot.cn
        run: >-
          python tools/create_update_manifest.py release-assets
          --repository "${{ github.repository }}" --tag "${{ github.ref_name }}"
          --base-url "${UPDATE_ORIGIN}/releases/${{ github.ref_name }}"
      - name: Configure update origin SSH
        env:
          UPDATE_HOST: ${{ secrets.MROBOT_UPDATE_HOST }}
          UPDATE_KNOWN_HOSTS: ${{ secrets.MROBOT_UPDATE_KNOWN_HOSTS }}
          UPDATE_SSH_KEY: ${{ secrets.MROBOT_UPDATE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${UPDATE_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf '%s\n' "${UPDATE_SSH_KEY}" > ~/.ssh/mrobot-update-deploy
          chmod 600 ~/.ssh/known_hosts ~/.ssh/mrobot-update-deploy
      - name: Publish to MRobot update origin
        env:
          UPDATE_HOST: ${{ secrets.MROBOT_UPDATE_HOST }}
          UPDATE_USER: ${{ secrets.MROBOT_UPDATE_USER }}
        run: |
          ssh -i ~/.ssh/mrobot-update-deploy "${UPDATE_USER}@${UPDATE_HOST}" \
            "mkdir -p '/srv/mrobot/releases/${{ github.ref_name }}' /srv/mrobot/stable"
          rsync -az --delay-updates -e "ssh -i ~/.ssh/mrobot-update-deploy" \
            release-assets/ \
            "${UPDATE_USER}@${UPDATE_HOST}:/srv/mrobot/releases/${{ github.ref_name }}/"
          scp -i ~/.ssh/mrobot-update-deploy release-assets/update.json \
            "${UPDATE_USER}@${UPDATE_HOST}:/srv/mrobot/stable/update.json.next"
          scp -i ~/.ssh/mrobot-update-deploy release-assets/update.json.sha256 \
            "${UPDATE_USER}@${UPDATE_HOST}:/srv/mrobot/stable/update.json.sha256.next"
          ssh -i ~/.ssh/mrobot-update-deploy "${UPDATE_USER}@${UPDATE_HOST}" \
            "mv /srv/mrobot/stable/update.json.next /srv/mrobot/stable/update.json && \
             mv /srv/mrobot/stable/update.json.sha256.next /srv/mrobot/stable/update.json.sha256"
