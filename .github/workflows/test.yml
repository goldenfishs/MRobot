name: test

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./mcode pytest PyYAML requests packaging
      - run: python -m pytest
      - run: python -m compileall -q app tools MRobot.py
