[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mrobot-desktop"
version = "0.3.2"
description = "Desktop frontend for the MRobot embedded framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MRobot" }]
dependencies = [
    "mrobot-mcode @ git+https://github.com/goldenfishs/MCode.git@v0.4.0",
    "PyQt5>=5.15",
    "PyQt-Fluent-Widgets>=1.7",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "openpyxl>=3.1",
    "packaging>=23.0",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "requests>=2.31"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["mcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
