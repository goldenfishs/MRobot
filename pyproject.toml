[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrobot-mcode"
version = "0.1.0"
description = "Headless code generation engine and CLI for the MRobot ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MRobot" }]
keywords = ["stm32", "cubemx", "embedded", "code-generation", "mrobot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["PyYAML>=6.0", "pytest>=8.0"]

[project.scripts]
mcode = "mcode.cli:main"

[tool.setuptools.packages.find]
include = ["mcode*"]

[tool.setuptools.package-data]
mcode = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
